<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="../images/logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeka Oyunları - teknolojitasarimci</title>
    <meta name="description" content="Teknoloji ve Tasarım dersi için 30 farklı zeka ve strateji oyunu: Dama, Satranç, Sudoku, Mangala, Hex, Tactix, Nim ve daha fazlası. Yapay zekaya karşı veya arkadaşınızla oynayın.">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme.js"></script>
    <style>
    .games-hub {
        max-width: 1200px;
        margin: 26px auto 60px !important;
        padding: 0 16px;
    }
    .games-hub-top {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 28px 32px;
        margin-bottom: 26px;
        box-shadow: 0 4px 20px -2px rgba(2, 132, 199, 0.08);
    }
    .games-hub-top h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 3.5vw, 32px);
        color: #0f172a;
        letter-spacing: -0.02em;
    }
    .games-hub-top p {
        margin: 0;
        color: #64748b;
        font-size: 15px;
        line-height: 1.7;
    }
    .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
    }
    .game-card {
        display: flex;
        flex-direction: column;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 0 0 18px;
        text-decoration: none !important;
        box-shadow: 0 4px 16px -4px rgba(2, 132, 199, 0.07);
        transition: transform 0.15s ease, border-color 0.15s ease;
        overflow: hidden;
    }
    .game-card:hover {
        transform: translateY(-3px);
        border-color: #0284c7;
    }
    .game-card-cover {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        background: #e0f2fe;
    }
    .game-card-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        padding: 16px 22px 0;
    }
    .game-card h2 {
        margin: 0 0 6px;
        font-size: 17px;
        color: #0f172a;
        letter-spacing: -0.01em;
    }
    .game-card p {
        margin: 0 0 14px;
        font-size: 13.5px;
        line-height: 1.6;
        color: #64748b;
        flex: 1;
    }
    .game-card-play {
        align-self: center;
        display: block;
        background: #0284c7;
        color: #ffffff !important;
        border-radius: 25px !important;
        padding: 8px 22px;
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none !important;
        width: fit-content;
        margin: 0 auto;
    }
    .game-card-play:hover {
        background: #0369a1;
    }
    body.dark .games-hub-top { background: #1e293b; border-color: #334155; }
    body.dark .games-hub-top h1 { color: #e2e8f0; }
    body.dark .games-hub-top p { color: #cbd5e1; }
    body.dark .game-card { background: #1e293b; border-color: #334155; }
    body.dark .game-card:hover { border-color: #38bdf8; }
    body.dark .game-card h2 { color: #e2e8f0; }
    body.dark .game-card p { color: #cbd5e1; }
    body.dark .game-card-play { background: #0284c7; color: #ffffff !important; }
    </style>
</head>
<body>

<div class="games-hub">
    <div class="games-hub-top">
        <h1>Zeka Oyunları</h1>
        <p>Teknoloji ve Tasarım dersinde kullanabileceğiniz 30 farklı zeka ve strateji oyunu. Oyunların çoğunda yapay zekaya karşı veya arkadaşınızla karşılıklı oynayabilirsiniz.</p>
    </div>
    <div class="games-grid" id="games-grid"></div>
</div>

<script>
(function () {
    var games = [
        ["klasik-sos", "SOS (Klasik)", "Klasik SOS oyunu: Karelerde S, O, S harflerini sırayla yerleştirip puan toplayınız.", "klasik-sos/Veri/klasik-sos-kapak.jpg"],
        ["acili-sos", "SOS (Acılı)", "SOS oyununun yeni taktikler gerektiren acılı versiyonu.", "acili-sos/Veri/acili-sos-kapak.jpg"],
        ["kelime-avi", "Kelime Bulmaca", "44 farklı kategoride yüzlerce kelime içeren etkileşimli kelime bulma oyunu. 11x11 ve 15x15 ızgaralar.", "../sayfalar/post-00073-Kelime-Avi/Veri/post-00073-Kapak.jpg"],
        ["kare-kapmaca", "Kare Kapmaca", "Çizgilerle kareler oluşturup en çok kareyi kapatmaya çalışınız.", "kare-kapmaca/Veri/kare-kapmaca-kapak.jpg"],
        ["turk-damasi", "Dama", "Klasik 8x8 Türk daması. Yapay zekaya karşı veya iki kişilik.", "turk-damasi/Veri/turk-damasi-kapak.jpg"],
        ["capraz-dama", "Çapraz Dama", "Çapraz dama kurallarıyla farklı bir dama deneyimi.", "capraz-dama/Veri/capraz-dama-kapak.jpg"],
        ["cin-damasi", "Çin Daması", "Altıgen tahtada hedef üçgene parçaları taşıma strateji oyunu.", "cin-damasi/Veri/cin-damasi-kapak.jpg"],
        ["satranc", "Satranç", "Yapay zekaya veya arkadaşınıza karşı oynayabileceğiniz klasik 8x8 satranç.", "satranc/Veri/satranc-kapak.jpg"],
        ["surakarta", "Surakarta", "Endonezya kökenli, dairesel yollarıyla özgün bir strateji oyunu.", "surakarta/Veri/surakarta-kapak.jpg"],
        ["mangala", "Mangala", "Geleneksel Türk zeka oyunu. Taşları toplayıp en çok sayıya ulaşınız.", "mangala/Veri/mangala-kapak.jpg"],
        ["bantumi", "Bantumi", "Klasik bezelye toplama ve dağıtma strateji oyunu. Yapay zekaya karşı veya arkadaşınızla.", "bantumi/Veri/bantumi-kapak.jpg"],
        ["tas-oyunlari", "3-6-9-12 Taş Oyunları", "Farklı taş sayılarıyla oynanan üç taş, altı taş, dokuz taş ve on iki taş oyunları.", "tas-oyunlari/Veri/tas-oyunlari-kapak.jpg"],
        ["hex-oyunu", "Hex", "11x11 altıgen tahtada kenardan kenara kesintisiz yol kurma oyunu.", "hex-oyunu/Veri/hex-oyunu-kapak.jpg"],
        ["tactix", "Tactix", "Matematiksel strateji oyunu: Son taşı alan kaybeder.", "tactix/Veri/tactix-kapak.jpg"],
        ["nim", "Nim", "Klasik kombinatorik oyun. Doğru hamleleri hesaplayarak kazanınız.", "nim/Veri/nim-kapak.jpg"],
        ["tilki-oyunu", "Tilki ve Yumurtalar", "Dört rampadan yuvarlanan yumurtaları sepetinizle yakalama refleksi oyunu.", "tilki-oyunu/Veri/tilki-oyunu-kapak.jpg"],
        ["tirtil-oyunu", "Tırtıl", "Bahçedeki meyveleri toplayarak büyüyen sevimli tırtıl oyunu.", "tirtil-oyunu/Veri/tirtil-oyunu-kapak.jpg"],
        ["solo-test", "Solo Test", "Tek kişilik zeka testi: Taşları zıplatıp tek taş kalana kadar oynayınız.", "solo-test/Veri/solo-test-kapak.jpg"],
        ["labirent-oyunu", "Labirent Bulmacaları", "Labirentte kediyi hedefe ulaştırma bulmacaları.", "labirent-oyunu/Veri/labirent-oyunu-kapak.jpg"],
        ["sudoku-atolyesi", "Sudoku", "Farklı zorluk seviyelerinde klasik 9x9 Sudoku.", "sudoku-atolyesi/Veri/sudoku-atolyesi-kapak.jpg"],
        ["bolgesel-sudoku", "Bölgesel Sudoku", "Düzensiz bölgeli sudoku: Klasik kurallar, farklı şekillerdeki bölgeler.", "bolgesel-sudoku/Veri/bolgesel-sudoku-kapak.jpg"],
        ["islem-karesi", "İşlem Karesi", "1-9 rakamlarını yerleştirip işlem önceliğine dikkat ederek satır ve sütun hedeflerine ulaşınız.", "../sayfalar/post-00069-Islem-Karesi/Veri/post-00069-Kapak.jpg"],
        ["patika-oyunu", "Patika", "Siyah karelere değmeden tüm beyaz kareleri tek bir kapalı çevrimle dolaşınız.", "../sayfalar/post-00068-Patika-Oyunu/Veri/post-00068-Kapak.jpg"],
        ["engelsiz-patika-oyunu", "Patika Oluşturma", "6x6 ızgarada parçaları tamamlayarak tüm hücrelerden geçen tek, kesişmeyen kapalı patika oluşturunuz.", "../sayfalar/post-00070-Engelsiz-Patika-Oyunu/Veri/post-00070-Kapak.jpg"],
        ["abc-baglamaca-oyunu", "ABC Bağlamaca", "Aynı harfleri birbirini kesmeyen çizgilerle eşleştiriniz, ızgaradaki bütün noktaları kullanınız.", "../sayfalar/post-00072-ABCBaglamaca/Veri/post-00072-Kapak.jpg"],
        ["kutuban", "Kutuban", "Kutuları iterek hedef noktalara ulaştırınız, 100 özel bulmaca bölümünü tamamlayınız.", "kutuban/Veri/kutuban-kapak.jpg"],
        ["carpmaca-oyunu", "Çarpmaca", "Sayıları her satır ve sütunda tam iki sayı olacak şekilde yerleştiriniz, çarpım ipuçlarını tamamlayınız.", "../sayfalar/post-00071-Carpmaca/Veri/post-00071-Kapak.jpg"],
        ["elmas-madencisi", "Elmas Madencisi", "Elmas madencisini yön tuşlarıyla labirentte ilerletiniz, pırlantaları toplayınız ve kazmayla duvarları kırarak yol açınız.", "elmas-madencisi/Veri/elmas-madencisi-kapak.jpg"],
        ["devekusu-kosusu", "Devekuşu Koşusu", "Güneşli bir günde devekuşunuzla koşunuz, zıplayıp eğilerek engelleri aşınız ve ateş püskürterek önünüzdeki engelleri yok ediniz.", "devekusu-kosusu/Veri/devekusu-kosusu-kapak.jpg"],
        ["trafik-isaretleri", "Trafik İşaretleri", "Türkiye'deki trafik işaretlerini öğrenip test ediniz: Mod 1 ve Mod 2 seçenekleriyle bilginizi ölçünüz.", "trafik-isaretleri/Veri/trafik-isaretleri-kapak.jpg"],
        ["bayrak-bil", "Bayrak Bil", "Dünya ülkelerinin bayraklarını eğlenceli ve öğretici bir yarışmayla keşfediniz.", "bayrak-bil/Veri/bayrak-bil-kapak.jpg"],
        ["mini-minisler", "Mini Minişler", "26 sevimli yavru hayvanla eşleştirme hafıza oyunu: 6 seviyede kartları çeviriniz, eşleşen çiftleri bulunuz.", "mini-minisler/Veri/mini-minisler-kapak.jpg"],
        ["bardak-oyunu", "Bardak Oyunu", "Bilyeyi dikkatle takip ediniz, doğru bardağı seçiniz!", "bardak-oyunu/Veri/bardak-oyunu-kapak.jpg"]
    ];
    var grid = document.getElementById('games-grid');
    games.forEach(function (g) {
        var a = document.createElement('a');
        a.className = 'game-card';
        a.href = g[0] + '/index.html';
        a.innerHTML = '<img class="game-card-cover" src="' + g[3] + '" alt="' + g[1] + '" loading="lazy" onerror="this.src=\'gecici-kapak.jpg\'"><div class="game-card-body"><h2>' + g[1] + '</h2><p>' + g[2] + '</p><span class="game-card-play">Oyna</span></div>';
        grid.appendChild(a);
    });
})();
</script>

<script src="../js/menu.js"></script>
<script src="../js/views.js"></script>
<script src="../js/protection.js"></script>
</body>
</html>
