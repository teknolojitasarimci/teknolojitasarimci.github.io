<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bardak ve Top Oyunu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="../../images/logo.svg">
</head>
<body>
    <div class="game-wrapper">
        <header>
            <h1>Bardak ve Top Oyunu</h1>
            <div class="score-display">
                <span>Skor: <span id="score">0</span></span>
                <span>Seviye: <span id="level">1</span></span>
            </div>
        </header>

        <main>
            <div class="game-area" id="gameArea">
                <!-- Bardaklar buraya JS ile eklenecek -->
            </div>
            <div class="controls">
                <button id="startBtn" class="btn">Başla</button>
                <button id="restartBtn" class="btn" style="display:none">Tekrar</button>
            </div>
        </main>

        <footer>
            <p>Türkiye Ortaokul Tasarımı • Tüm hakları saklıdır</p>
        </footer>
    </div>

    <script src="../../js/peka-game.js"></script>
</body>
</html>
