---
layout: default
---
<article class="container post-detail" style="max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04);">
    <header class="post-header" style="margin-bottom: 30px; text-align: center;">
        <span class="category" style="color: var(--brand-color); font-weight:bold; font-size:14px; text-transform:uppercase; letter-spacing: 1px;">{{ page.category }}</span>
        <h1 class="post-title" style="font-size:36px; margin: 15px 0; line-height: 1.3;">{{ page.title }}</h1>
        <p class="post-meta" style="color: #94a3b8; font-size:15px;">{{ page.date | date: "%d.%m.%Y" }}</p>
    </header>

    {% if page.image %}
    <div style="margin-bottom: 40px;">
        <img src="{{ page.image }}" alt="{{ page.title }}" style="width:100%; border-radius: 12px; object-fit: cover; max-height: 450px;">
    </div>
    {% endif %}

    <div class="post-content" style="font-size: 17px; line-height: 1.8; color: #444;">
        {{ content }}
    </div>
</article>
