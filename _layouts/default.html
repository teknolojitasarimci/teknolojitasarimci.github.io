<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Google Fonts: Rubik & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;1,700&family=Rubik:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <!-- CSS Dosyası -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
    
    <header class="header">
        <div class="container header-container">
            <div class="logo-area">
                <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Sitede ara..." aria-label="Arama yap">
                <button aria-label="Ara">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="{{ '/js/script.js' | relative_url }}"></script>
</body>
</html>
