<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Google Fonts: Rubik & Open Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Rubik:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <!-- CSS Dosyası -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
    
    <header class="header">
        <div class="container header-main">
            <div class="brand-area">
                <div class="tt-logo-icon">tt</div>
                <div class="brand-text">
                    <a href="{{ '/' | relative_url }}" class="logo">{{ site.title }}</a>
                    <p class="tagline">Hayal Et, Tasarla, Yenilikçi Ol, İlerle!</p>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Site içi arama yapın..." aria-label="Arama yap">
                <button aria-label="Ara" class="search-btn">
                    <svg width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 7L1 1L1 13L11 7Z" fill="white" stroke="white" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Hap (Pill) Navigasyon Menüsü -->
        <nav class="nav-bar">
            <div class="container nav-container">
                <a href="{{ '/' | relative_url }}" class="nav-pill active">Ana Sayfa</a>
                <a href="{{ '/category/7-sinif-etkinlikleri' | relative_url }}" class="nav-pill">7. Sınıf Etkinlikleri</a>
                <a href="{{ '/category/8-sinif-etkinlikleri' | relative_url }}" class="nav-pill">8. Sınıf Etkinlikleri</a>
                <a href="{{ '/category/dosyalar' | relative_url }}" class="nav-pill">Dosyalar</a>
                <a href="{{ '/category/ogrenci-calismalari' | relative_url }}" class="nav-pill">Öğrenci Çalışmaları</a>
                <a href="{{ '/category/zeka-oyunlari' | relative_url }}" class="nav-pill">Zeka Oyunları</a>
                <a href="{{ '/hakkimda' | relative_url }}" class="nav-pill">Hakkımda</a>
            </div>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. Tüm hakları saklıdır.</p>
        </div>
    </footer>

    <script src="{{ '/js/script.js' | relative_url }}"></script>
</body>
</html>
